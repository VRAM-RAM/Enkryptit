name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "doc/**"
      - "**.md"
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "doc/**"
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static checks, tests, rustdoc, audit
  checks:
    name: fmt · clippy · test · doc · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests (eck_tests harness)
        run: cargo xtask test

      - name: Build rustdoc (warnings as errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (allowlist in audit.toml)
        run: cargo audit

  # OS keyring roundtrip (macOS only)
  keyring:
    name: OS keyring roundtrip (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Keyring roundtrip (#[ignore]d test)
        run: cargo test --test=eck_tests encrypt_decrypt_os_keytype_roundtrip -- --ignored