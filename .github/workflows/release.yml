name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: eck
            suffix: ""
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: eck
            suffix: ""
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bin: eck
            suffix: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: eck
            suffix: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: eck.exe
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: eck-${{ matrix.target }}${{ matrix.suffix }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # ---- Draft GitHub release with checksums ----
  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
          body: |
            ## Enkryptit! ${{ github.ref_name }}

            > [!WARNING]
            > Gatekeeper note (macOS)
            > Release binaries are **not notarized/signed**. On first launch macOS may
            > warn "cannot be opened because the developer cannot be verified".
            > Workarounds: right-click => *Open*, or from a terminal:
            > `xattr -dr com.apple.quarantine eck`
            >
            > Windows: SmartScreen may show an "unrecognized app" warning — click
            > *More info : Run anyway*.

            Checksums are provided as `*.sha256` files next to each binary.