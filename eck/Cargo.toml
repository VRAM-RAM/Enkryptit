[package]
name = "eck"
version = "0.0.4"
description = "A fast, simple file & folder encryption manager, written in Rust" 
keywords = ["cli", "encryption", "cryptography"]
edition = "2024"
license = "CECILL-B OR Apache-2.0"
repository = "https://github.com/VRAM-RAM/Enkryptit"
authors = ["Olruix (VRAM-RAM)"]
rust-version = "1.85"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
comfy-table = "8.0.0"
directories = "6.0.0"
dirs = "6.0.0"
fmodeparser = "0.1.0"
gradient-bar = "0.1.1"
hex = "0.4.3"
indicatif = "0.18.4"
infer = "0.22.0"
inquire = "0.9.4"
keyring = "2.0"
libc = "0.2.186"
lz4_flex = "0.13.1"
miette = { version = "7.6.0", features = ["fancy"] }
oxiarc-core = "0.4.2"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.8"
rfd = "0.17.2"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.6"
terminal_size = "0.4"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"]}
unicode-segmentation = "1"
unicode-width = "0.2"
walkdir = "2.5.0"
xz2 = "0.1.7"
zeroize = "1.8.2"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
ctor = "0.2"
unicode-width = "0.2"

[[test]]
name = "eck_tests"
path = "test/mod.rs"
harness = true
