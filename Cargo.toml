[package]
name = "eck"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
directories = "6.0.0"
dirs = "6.0.0"
hex = "0.4.3"
indicatif = "0.18.4"
inquire = "0.9.4"
keyring = "2.0"
libc = "0.2.186"
lz4_flex = "0.13.1"
nix = "0.31.3"
oxiarc-core = "0.3.0"
postcard = { version = "1", features = ["alloc"] }
rand = "0.8"
rfd = "0.17.2"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
text_io = "0.1.13"
thiserror = "2.0.18"
walkdir = "2.5.0"
xz2 = "0.1.7"
zeroize = "1.8.2"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
ctor = "0.2"

[[test]]
name = "eck_tests"
path = "test/mod.rs"
harness = true

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
